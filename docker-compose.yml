name: realtimecheat_app

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: realtimecheat_app-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: realtimecheat_app-backend
    restart: unless-stopped
    environment:
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: realtimecheat_app-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "password_encryption=md5"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: realtimecheat_app
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
      TZ: Asia/Bangkok
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/database/database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d realtimecheat_app"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
    name: realtimecheat_app_pg_data